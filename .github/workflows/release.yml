name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: mints the OIDC token that signs the attestation
      # linking the published tarball to this exact commit and workflow run.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1; both are pinned
      # below. setup-node must be v7 or newer -- earlier versions exported a dummy
      # NODE_AUTH_TOKEN that defeats OIDC the same way an empty secret does.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org
          cache: npm

      # 11.5.1 is the floor for trusted publishing, and 11.x accepts any Node >= 22.9, so it
      # matches the pin above. Deliberately not `npm@latest`: npm 12 requires Node
      # ^22.22.2 || ^24.15.0 || >=26, so `latest` drifted past this runner and failed the
      # release on an engine check before a single test ran. A release workflow must not
      # depend on a floating tag -- the failure arrives on the day you are trying to ship.
      - name: Use an npm new enough for trusted publishing
        run: npm install -g "npm@^11.5.1"

      - run: npm ci

      # The same pipeline as CI. A tag must not be able to publish something that does not
      # typecheck, build, and pass its tests.
      - name: Verify
        run: npm run verify

      - name: Confirm the tag matches package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN here, deliberately. setup-node's registry-url writes
      # _authToken=${NODE_AUTH_TOKEN} into .npmrc; if that variable is set but empty -- which
      # is exactly what a missing NPM_TOKEN secret expands to -- npm reads it as "auth is
      # already configured", never starts the OIDC exchange, and fails with ENEEDAUTH.
      # Leaving the variable unset is what makes trusted publishing engage.
      # No --provenance flag: under trusted publishing npm generates and attaches the
      # attestation itself, and passing the flag as well asks it to do the same work through
      # the pre-OIDC path. The flag is still required when publishing with a token, so it
      # comes back if this workflow ever falls back to NPM_TOKEN.
      #
      # The failure is echoed as a workflow ::error:: because job logs need authentication to
      # read, while check-run annotations do not -- without this, a failed release says only
      # "exit code 1" to anyone who cannot sign in.
      - name: Publish
        run: |
          set -o pipefail
          if ! npm publish --access public 2>&1 | tee publish.log; then
            echo "::error::npm publish failed -- $(grep -iE '^npm (error|ERR!)' publish.log | head -12 | tr '\n' ' / ')"
            exit 1
          fi
