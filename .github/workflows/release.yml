name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: mints the OIDC token that signs the attestation
      # linking the published tarball to this exact commit and workflow run.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1. Pinning them here
      # means that once the package exists and a trusted publisher is configured on
      # npmjs.com, the NPM_TOKEN secret below can simply be deleted.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use an npm new enough for trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # The same pipeline as CI. A tag must not be able to publish something that does not
      # typecheck, build, and pass its tests.
      - name: Verify
        run: npm run verify

      - name: Confirm the tag matches package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # NODE_AUTH_TOKEN is only consulted when no trusted publisher is configured. Once one
      # is, OIDC supplies a short-lived credential and the secret becomes dead weight.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
