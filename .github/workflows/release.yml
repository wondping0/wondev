name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: mints the OIDC token that signs the attestation
      # linking the published tarball to this exact commit and workflow run.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1; both are pinned
      # below. setup-node must be v7 or newer -- earlier versions exported a dummy
      # NODE_AUTH_TOKEN that defeats OIDC the same way an empty secret does.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org
          cache: npm

      # 11.5.1 is the floor for trusted publishing, and 11.x accepts any Node >= 22.9, so it
      # matches the pin above. Deliberately not `npm@latest`: npm 12 requires Node
      # ^22.22.2 || ^24.15.0 || >=26, so `latest` drifted past this runner and failed the
      # release on an engine check before a single test ran. A release workflow must not
      # depend on a floating tag -- the failure arrives on the day you are trying to ship.
      - name: Use an npm new enough for trusted publishing
        run: npm install -g "npm@^11.5.1"

      # setup-node's registry-url writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into .npmrc whether or not a token exists. npm treats the mere presence of that line
      # as "authentication is configured", so it never starts the OIDC exchange and PUTs the
      # tarball anonymously -- which the registry answers with E404, not 401, because it will
      # not confirm a package exists to an unauthenticated caller. The error therefore reads
      # as "no such package" while the real cause is an empty credential.
      #
      # Deleting the line is what makes npm look for OIDC. The registry line above it stays.
      - name: Remove the placeholder auth line so trusted publishing engages
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            echo "npmrc after cleanup:"; cat "$npmrc"
          else
            echo "no .npmrc at $npmrc"
          fi

      - run: npm ci

      # The same pipeline as CI. A tag must not be able to publish something that does not
      # typecheck, build, and pass its tests.
      - name: Verify
        run: npm run verify

      - name: Confirm the tag matches package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # Both of the steps below write to check-run annotations rather than the job log,
      # because annotations are readable without authentication and job logs are not. A
      # failed release otherwise reports "Process completed with exit code 1" and nothing
      # else to anyone who cannot sign in to this repository.
      #
      # Trusted publishing needs three things true at once and ENEEDAUTH names none of them,
      # so they are printed explicitly: npm past 11.5.1, an OIDC request URL from the
      # id-token permission, and an .npmrc carrying no auth line.
      - name: Report the publish preconditions
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then oidc=available; else oidc=MISSING; fi
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "::warning::node=$(node -v) npm=$(npm -v) oidc=$oidc registry=$(npm config get registry) npmrc=[$(tr '\n' ';' < "$npmrc" 2>/dev/null)]"

      # Deliberately no NODE_AUTH_TOKEN and no --provenance.
      #
      # An empty NODE_AUTH_TOKEN -- which is what a missing NPM_TOKEN secret expands to --
      # reads to npm as "auth is already configured" and stops it ever trying OIDC. And under
      # trusted publishing npm attaches the provenance attestation itself, so the flag only
      # asks for the same work through the pre-OIDC path. Both come back together if this
      # workflow is ever switched to token auth; neither works half-applied.
      - name: Publish
        run: |
          set -o pipefail
          if ! npm publish --access public 2>&1 | tee publish.log; then
            echo "::error::npm publish failed -- $(grep -iE '^npm (error|ERR!)' publish.log | head -12 | tr '\n' ' / ')"
            exit 1
          fi
